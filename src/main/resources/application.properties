spring.application.name=pawsandrequests
# REVIEW(azure): the H2 console is on unconditionally, and SecurityConfig ends with .anyRequest().permitAll(), so /h2-console is a publicly reachable database browser the moment this is deployed. If you want it at all, put it in application-dev.properties only.
spring.h2.console.enabled=true
# REVIEW(azure): this is the single biggest blocker to deploying anywhere. An in-memory H2 is the only datasource, so every container restart (and Azure restarts containers routinely) wipes all data, and two replicas each get their own private database.
# REVIEW(azure): the PostgreSQL driver is already in the pom. Point the URL at an env var and let Azure inject it: spring.datasource.url=${SPRING_DATASOURCE_URL} / username=${SPRING_DATASOURCE_USERNAME} / password=${SPRING_DATASOURCE_PASSWORD}. Keep the H2 settings in an application-dev.properties and run prod with SPRING_PROFILES_ACTIVE=prod.
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driver-class-name=org.h2.Driver
# REVIEW(config): database credentials committed in the file. Harmless for local H2, but the moment this line becomes a real Postgres password it is a leak, and the habit is what gets graded. Everything environment-specific belongs in an env var, not in the repo.
spring.datasource.username=sa
spring.datasource.password=password
# REVIEW(azure): defer-datasource-initialization + data.sql means the app re-seeds itself on every boot. Against a real database this either duplicates rows or crashes on the primary key. Use Flyway (Lux does this) for schema and seed only in the dev profile.
spring.jpa.defer-datasource-initialization=true
# REVIEW(good): this is the right shape. The secret comes from the environment, JwtProperties validates it with @NotBlank, and nothing is hardcoded. Do the same for the datasource.
# REVIEW(bug): JwtService base64-decodes this value. If someone exports a plain string as JWT_SECRET the app dies at startup with an opaque IllegalArgumentException. Document the expected format (base64 of at least 32 bytes) in the README.
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-minutes=60
# REVIEW(azure): nothing here configures a health endpoint. Azure Container Apps and App Service both want a URL to probe before they route traffic. Add spring-boot-starter-actuator and expose /actuator/health, then point the probe at it.
# REVIEW(azure): no CORS configuration anywhere in the project. Locally the frontend is proxied by Vite so you never notice; in Azure the frontend is on a different origin and every call fails. Add a CorsConfigurationSource whose allowed origin comes from a property, e.g. app.cors.allowed-origins=${FRONTEND_ORIGIN}.
