spring.application.name=pawsandrequests
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/nyanbirds}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${DB_USERNAME:nyanbirds}
spring.datasource.password=${DB_PASSWORD:nyanbirds}
spring.jpa.hibernate.ddl-auto=validate

# Flyway owns the schema: db/migration/V1 creates the tables, V2 seeds them.
# The Azure database already exists and predates Flyway, so it gets baselined
# at version 2 instead of running V1 and V2 again. An empty database is not
# baselined and receives both migrations.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=2

# Fills picture.data from src/main/resources/images on startup, replacing the
# placeholder bytes in V2. Off by default because the Azure database holds
# real uploads that must not be overwritten; compose.yaml enables it locally.
app.seed-pictures.enabled=${APP_SEEDPICTURES_ENABLED:false}

app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-minutes=60
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.leak-detection-threshold=5000
