spring.application.name=pawsandrequests
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/nyanbirds}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${DB_USERNAME:nyanbirds}
spring.datasource.password=${DB_PASSWORD:nyanbirds}
spring.jpa.hibernate.ddl-auto=validate

# Flyway owns the schema: db/migration/V1 creates the tables. Hibernate stays
# on ddl-auto=validate and only checks that the two agree.
#
# Baseline is OFF by default, so an empty database always runs every migration
# from V1. Leaving it on would mark *any* non-empty schema as already current,
# which silently skips migrations on a stale local volume or a half-created
# database. Opt in only for a database that genuinely predates Flyway.
#
# The deployed Azure database is that case and sets FLYWAY_BASELINE_ON_MIGRATE
# plus FLYWAY_BASELINE_VERSION=1, because its schema already matches V1.
#
# db/seed holds demo rows and is NOT a default location: only the local compose
# stack adds it through FLYWAY_LOCATIONS, so a deployed database can never be
# seeded however it is baselined.
spring.flyway.baseline-on-migrate=${FLYWAY_BASELINE_ON_MIGRATE:false}
spring.flyway.baseline-version=${FLYWAY_BASELINE_VERSION:1}
spring.flyway.locations=${FLYWAY_LOCATIONS:classpath:db/migration}

# Fills picture.data from src/main/resources/images on startup, replacing the
# placeholder bytes in the seed migration. Off by default because the Azure
# database holds real uploads that must not be overwritten; compose.yaml
# enables it locally.
app.seed-pictures.enabled=${APP_SEEDPICTURES_ENABLED:false}

app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-minutes=60
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.leak-detection-threshold=5000
server.servlet.context-path=/api
