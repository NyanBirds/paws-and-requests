spring.application.name=pawsandrequests
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/nyanbirds}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${DB_USERNAME:nyanbirds}
spring.datasource.password=${DB_PASSWORD:nyanbirds}
spring.jpa.hibernate.ddl-auto=validate

# Flyway is a LOCAL DEVELOPMENT TOOL, and it stays off unless FLYWAY_ENABLED
# is set. A deployment therefore runs no migrations at all: it connects to the
# database that already exists and changes nothing. compose.yaml turns it on for
# the local stack, and a local run without Docker needs FLYWAY_ENABLED=true.
#
# That is what makes ddl-auto=validate the only schema guard in production,
# which is deliberate. The deployed database predates Flyway, holds real data
# and has no flyway_schema_history table, so letting Flyway near it means
# either an aborted startup or a schema nobody asked to touch. Validation still
# runs on every boot and fails loudly if an entity drifts from the live tables.
#
# Locally, baseline stays off so an empty database always runs every migration
# from V1. Baselining would mark *any* non-empty schema as already current and
# silently skip migrations on a stale volume.
#
# db/seed holds demo rows and is NOT a default location: only compose.yaml adds
# it through FLYWAY_LOCATIONS, so demo data can never reach the deployed
# database.
spring.flyway.enabled=${FLYWAY_ENABLED:false}
spring.flyway.baseline-on-migrate=${FLYWAY_BASELINE_ON_MIGRATE:false}
spring.flyway.baseline-version=${FLYWAY_BASELINE_VERSION:1}
spring.flyway.locations=${FLYWAY_LOCATIONS:classpath:db/migration}

# Fills picture.data from src/main/resources/images on startup, replacing the
# placeholder bytes in the seed migration. Off by default because the Azure
# database holds real uploads that must not be overwritten; compose.yaml
# enables it locally.
app.seed-pictures.enabled=${APP_SEEDPICTURES_ENABLED:false}

app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-minutes=60
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.leak-detection-threshold=5000
server.servlet.context-path=/api
